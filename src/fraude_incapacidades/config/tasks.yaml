extract_and_validate_task:
  description: >
    PASO 1 — EXTRACCIÓN Y ANÁLISIS FORENSE DEL DOCUMENTO
    
    Archivo a analizar: {file_path}

    METADATOS FORENSES DETERMINISTAS DEL PDF (calculados por el sistema; tómalos como hechos):
    {metadatos_forenses}
    Si el estado es "editor_grafico" hay rastro de edición gráfica (-35 pts). Si es "aplanados" es solo una
    alerta informativa leve: el archivo NO se califica como adulterado (aplica solo el -10 de metadatos aplanados).
    
    A) EXTRACCIÓN FORENSE Y ESTRUCTURADA: Usa la herramienta "Extraccion Forense y Estructuracion PDF"
       pasándole exactamente la ruta: {file_path}
       La herramienta usa un LLM interno para devolver un JSON limpio con datos del paciente, médico,
       EPS, diagnóstico y un análisis de logos/metadatos.
    
    B) LECTURA DEL JSON RESULTANTE: La herramienta usa un modelo de visión para VER el documento.
       El JSON resultante ahora incluye:
       - paciente_nombre, paciente_tipo_doc, paciente_cedula
       - medico_nombre, medico_cedula, medico_registro_medico, consecutivo_incapacidad
       - documento_manuscrito, legibilidad_estimada
       - eps_o_ips (también detectado visualmente del logo)
       - logo_detectado (descripción visual del logo que el modelo identificó)
       - tiene_firma (si vio una firma en el documento)
       - tiene_sello (si vio un sello)
       - evaluacion_visual (opinión profesional del modelo de visión sobre la autenticidad)
       - codigo_cie10, diagnostico_texto, dias_incapacidad, fechas
    
    C) VALIDACIÓN CIE-10: Si hay un código CIE-10 extraído, usa "Validacion CIE-10" con un JSON:
       {"codigo": "CÓDIGO", "diagnostico_texto": "DESCRIPCIÓN", "dias_incapacidad": NUMERO}
       
    D) ANÁLISIS DE INTEGRIDAD: Revisa las alertas_forenses_automaticas y la evaluacion_visual.
       La evaluacion_visual del modelo de visión es la fuente más confiable para detectar manipulación.
       Si el modelo de visión dice que el documento "parece auténtico y profesional", eso es
       un indicador FUERTE de legitimidad.

    Genera una lista equilibrada de hallazgos positivos Y negativos.
    NO seas excesivamente escéptico con documentos que tienen todos los datos correctos.
    
  expected_output: >
    Un reporte con datos estructurados extraídos, hallazgos positivos (datos completos,
    logo presente, CIE válido) y negativos (alertas forenses si las hay).
  agent: auditor_medico_forense

search_and_verify_task:
  description: >
    PASO 2 — VERIFICACIÓN CRUZADA DE ENTIDADES
    
    A) VALIDACIÓN DE LA EPS: Usa "Validacion EPS Colombia" con el nombre de la EPS del documento.
       Si el documento menciona una IPS (clínica) y no una EPS, NO des alerta por eso.
       Recuerda: IPS ≠ EPS. Las incapacidades suelen ser emitidas por la IPS (clínica) donde
       atienden al paciente, NO por la EPS directamente. Que la EPS no se encuentre en la lista
       NO significa fraude si es una IPS o clínica.
    
    B) VERIFICACIÓN RETHUS: Usa "Verificacion RETHUS SISPRO" con la cédula del médico.
       IMPORTANTE: Si el servicio SISPRO no responde, devuelve CAPTCHA o da error,
       NO consideres esto como evidencia de fraude. Simplemente indica que la verificación
       no fue posible de forma automatizada. El servicio gubernamental tiene limitaciones técnicas.
    
    C) VERIFICACIÓN ADRES: Usa "Verificacion ADRES BDUA" con la cédula del paciente.
       IMPORTANTE: Mismo criterio que RETHUS. Si el servicio no responde, NO es evidencia de fraude.
    
    D) BÚSQUEDA WEB OSINT: Usa "Busqueda Web OSINT" con el nombre de la clínica/IPS.
       IMPORTANTE: Solo reporta como alerta si encuentras resultados ESPECÍFICOS que mencionan
       directamente a esa clínica en particular en casos de fraude comprobado.
       Noticias genéricas sobre fraude de incapacidades en Colombia NO son evidencia contra
       esta clínica en particular.
    
  expected_output: >
    Resultados de cada verificación con interpretación JUSTA. Distinguir entre
    "no verificado por limitación técnica" vs "evidencia real de fraude".
  agent: investigador_osint

generate_final_report_task:
  description: >
    PASO 3 — GENERAR INFORME FINAL EN JSON

    Consolida la información y genera EXCLUSIVAMENTE un JSON con esta estructura:

    {
      "puntaje_veracidad": <0 a 100, o null si el documento es Inconcluso>,
      "veredicto": "<Válido|Sospechoso|Potencialmente Fraudulento|Inconcluso / No Procesable>",
      "hallazgos_medicos": "<texto>",
      "analisis_forense": "<texto>",
      "verificacion_entidades": "<texto>",
      "alertas": ["alerta de riesgo real 1", ...],
      "desglose": [{"regla": "<nombre de la regla>", "puntos": <negativo>}],
      "verificadores": [
        {"fuente": "Catálogo CIE-10", "estado": "<Verificado|Alerta de Rango|No encontrado>", "detalle": "<texto>"},
        {"fuente": "EPS / Catálogo Local", "estado": "<Verificado|No encontrado>", "detalle": "<texto>"},
        {"fuente": "RETHUS / SISPRO", "estado": "<Verificado|No encontrado|Consulta No Disponible>", "detalle": "<texto>"},
        {"fuente": "ADRES / BDUA", "estado": "<Verificado|Inactiva|Consulta No Disponible>", "detalle": "<texto>"},
        {"fuente": "Fuentes Abiertas OSINT", "estado": "<Sin hallazgos adversos|Hallazgo específico|Consulta No Disponible>", "detalle": "<texto>"}
      ],
      "verificacion_externa_pendiente": ["RETHUS", "ADRES"],
      "datos_extraidos": {
        "paciente": {"nombre": "<nombre>", "tipo_doc": "<CC|TI|CE|...>", "numero": "<número>"},
        "profesional": {"nombre": "<nombre>", "cedula": "<cédula>", "registro_medico": "<RM>"},
        "entidad": {"eps_ips": "<nombre>", "logo": "<Detectado|Ausente>", "firma_sello": "<Legible|No legible / Ausente>"},
        "incapacidad": {"consecutivo": "<id>", "codigo_cie10": "<código>", "fecha_inicio": "<AAAA-MM-DD>",
                        "fecha_fin": "<AAAA-MM-DD>", "dias_otorgados": <número>, "rango_cie10": "<ej. 1-3 días>"}
      }
    }

    Si un dato no es identificable usa "No legible" o "Dato ausente" (nunca inventes datos).
    "verificacion_externa_pendiente" lista SOLO las fuentes cuya consulta no estuvo disponible.

    REGLAS DE PUNTAJE (Entregable 1: partir de 100 y restar SOLO por evidencia real):
    - -45 pts: RETHUS u OSINT indican que el profesional no existe / no tiene habilitación vigente,
      o la IPS emisora es apócrifa.
    - -35 pts: adulteración digital en regiones críticas (fechas/días) o rastros de Photoshop,
      Illustrator, Canva o editores PDF en línea en los metadatos.
    - -25 pts: incoherencia clínica CIE-10 (días de reposo que superan en más del 100% el estándar
      de referencia) o error aritmético entre fecha de inicio, fecha de fin y días otorgados.
    - -20 pts: ADRES reporta afiliación inactiva o la EPS de afiliación no coincide con la emisora.
    - -10 pts: metadatos eliminados/aplanados, o no se detecta visualmente firma o sello médico.
    Cada regla se aplica UNA sola vez. No existen puntos positivos.

    FACTORES QUE NO restan puntos (0 pts):
    - RETHUS/ADRES/OSINT no responde (CAPTCHA, timeout, error técnico): estado
      "Verificación externa pendiente"; NUNCA es evidencia de fraude.
    - PDF creado con Adobe Acrobat, Microsoft Word o sistemas HIS.
    - Noticias genéricas sobre fraude de incapacidades en Colombia.
    - Fechas de creación/modificación ligeramente diferentes.

    VEREDICTO por puntaje: 80-100 "Válido" | 41-79 "Sospechoso" | 0-40 "Potencialmente Fraudulento".
    La herramienta de extracción reporta "documento_manuscrito" y "legibilidad_estimada" (0-100).
    Si el documento es manuscrito, ilegible o con legibilidad/lectura OCR < 70%: veredicto
    "Inconcluso / No Procesable" y puntaje_veracidad null (sin puntaje especulativo).

    Habeas Data (Ley 1581): anonimiza el nombre del paciente (ej: "J*** D***") y enmascara su número
    de documento en TODOS los textos del informe.
    IMPORTANTE: RESPONDE SOLO CON EL JSON, sin texto antes ni después.

  expected_output: >
    JSON estricto para el frontend.
  agent: redactor_dictamen
